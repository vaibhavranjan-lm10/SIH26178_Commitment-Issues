# PRAHARI Code B — MCU side.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_GNSS=y
CONFIG_GNSS_SATELLITES=n
# No zephyr,console is chosen (see boards/arduino_uno_q.overlay: the only
# spare UART is dedicated to the binary MsgPack-RPC bridge) — CONFIG_CONSOLE
# and CONFIG_UART_CONSOLE are therefore left unset, and CONFIG_PRINTK stays
# on for a debugger-attached RTT/semihosting backend, not the RPC UART.
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
